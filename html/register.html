<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register | Student Management System</title><link rel="stylesheet" href="../css/style.css"></head>
<body><div class="auth-wrap"><div class="auth-box"><h2>Create Account</h2><p class="sub">Register a new teacher account</p>
<div id="msg" class="msg"></div>
<form id="regForm"><div class="field"><label>Full Name</label><input id="name" required></div>
<div class="field"><label>Username</label><input id="username" required></div>
<div class="field"><label>Password</label><input id="password" type="password" required></div>
<div class="field"><label>Confirm Password</label><input id="confirm" type="password" required></div>
<button class="btn">Register</button></form>
<p class="alt">Already registered? <a href="login.html">Login</a></p></div></div>
<script src="../js/auth.js"></script><script src="../js/register.js"></script></body></html>
