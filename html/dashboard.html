<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard | Student Management System</title><link rel="stylesheet" href="../css/style.css"></head>
<body><main class="main"><div class="topbar"><h1>Dashboard</h1><span class="user"></span></div>
<div class="cards" id="stats"></div>
<div class="grid2"><div class="panel"><h3>Average Marks by Subject</h3><div id="chart"></div></div>
<div class="panel"><h3>Top Performers</h3><table><thead><tr><th>Name</th><th>Class</th><th>%</th><th>Grade</th></tr></thead><tbody id="top"></tbody></table></div></div>
<div class="panel"><h3>Recent Admissions</h3><table><thead><tr><th>Roll No</th><th>Name</th><th>Class</th></tr></thead><tbody id="recent"></tbody></table></div></main>
<script src="../js/auth.js"></script><script src="../js/dashboard.js"></script><script src="../js/teacher-dashboard.js"></script></body></html>
